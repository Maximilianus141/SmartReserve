name: Maven Unit Tests

# Triggers on EVERY push to ANY branch
on:
  push:

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 26
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          # Note: Java 26 is an Early Access (EA) build. 
          # The '-ea' suffix is required by setup-java for non-GA versions.
          java-version: '26' 
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Run the unit tests
      - name: Run Unit Tests
        run: mvn test

      # Step 4: Upload test reports if tests fail
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always() # Runs even if the previous step fails
        with:
          name: unit-test-reports
          path: target/surefire-reports/
